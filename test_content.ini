1.목적

목적은 시니어 대상으로 블로그야.

2.내용 작성

선정된 주제와 원본데이터를 가지고 블로그 내용을 만들어줘. 내용은 3번 블로그 샘플데이터 형식으로 작성해줘.

- '~이다' 형식으로 작성.
- 주제, 원본데이터, 기획의도, 링크를 확인하고 작성.
- 원본데이터 내용을 확인 후 선정한 주제에 맞게 작성.
- 주제와 맞는 내용으로 작성
- 내용이 주제에 맞지 않는다면 작성금지.
- 해당 내용이 주제와 반대내용이나 더 많은 내용이 있어도 주제와 가까운 내용으로만 읽기 쉽게 기재.
- 읽는 이가 복잡하지 않고 쉽게 읽히도록 작성.
- 만약에 정보가 더 필요하다면 공신력있는 사이트(뉴스나 정보기관) 데이터를 수집하는 건 괜찮음. 대시 출처는 반드시 기재.
- data 폴더 안에 make_news.md 파일에다가 기재


3.블로그 샘플데이터

1. 아들이 결혼한다고 말한 날.
부모는 오천만원쯤 생각했다.
치르고 나니 일억이 넘었다.

부모도 자식도
어디서 두 배가 됐는지 몰랐다.

왜 두 배가 됐는지 세어보자.

신혼부부 조사를 보면
결혼에 드는 돈 전체가
삼억육천만원이다.

그중 집값이 이억팔천이다.
나머지가 팔천만원 남짓이다.


집을 뺀 결혼식 자체가
그 팔천이다.


부모가 처음 계산할 때는
예식장과 혼수만 센다.

예식홀에 천만원
혼수에 천오백만원.
합쳐 이천오백이면 되겠다 싶다.
여기까지가 부모 머릿속 계산이다.
여기서 빠진 게 셋이다.

먼저 예식 준비 비용이다.

드레스와 사진과 화장.

여기에 예물과 예단까지 붙는다.
합치면 이천만원을 넘긴다.

하나하나는 몇백만원인데
항목이 열 개가 넘는다.

다음은 신혼여행이다.

요즘은 열흘에 천만원이 예사다.
멀리 갈수록 더 든다.

마지막이 제일 크다.
전세 보증금이다.

자식이 모은 돈으로는 모자라서
부모가 오천을 보탠다.
이 오천이 계산에 없던 돈이다.

집값은 부모 계산에
처음부터 안 들어 있었다.

​그래서 오천이 일억이 된다.
부모가 계산을 못 한 게 아니라

항목을 몰랐던 것이다.
여기서 부모가 놓치는 게 하나 더 있다.

그 일억이 어디서 나오느냐다.
대개 퇴직금이나 예금에서 나온다.

​퇴직금 일억은
스무 해 연금으로 치면
매달 사십만원이다.

​그 사십만원은
부모가 여든까지 못 받는다.

​결혼식 하루가
부모 노후에서 매달 사십만원을 가져간다.

그러면 어떻게 해야 할까.
총액을 먼저 정하는 것이다.

오천이면 오천이라고 말하고
그 안에서 쓰게 한다.

남으면 자식이 갖고
모자라면 자식이 채운다.

이렇게 하면 두 배가 안 된다.
말을 언제 하느냐도 중요하다.

날짜를 잡은 뒤에 말하면
이미 계약이 끝난 뒤다.

상견례 전에 말해야 한다.

그 자리에서 총액을 말하면
사돈댁도 같은 기준으로 움직인다.

​쉰아홉 살 아버지가
아들에게 봉투 하나를 주며 말했다.

​이게 전부고
모자라면 너희가 채우라고.

그 말 한마디에
예식장이 한 급 낮아졌고
신혼여행이 닷새로 줄었다.

​결혼 비용이 두 배가 되는 건
물가 탓이 아니다.

​총액을 안 정한 탓이다.

-------------

2. 국민연금으로 매달
100만원 넘게 받는 사람들이 있다.
​
110만명이 넘는다.
​
반면 전체 노령연금 평균 수령액은
월 70만원 수준이다.
​
같은 국민연금인데
누구는 70만원을 받고
누구는 100만원 넘게 받는다.
​
오늘 제목에서 말한 정답부터 말하면
그 차이는 가입기간이다.
​
소득이 높아서가 아니다.
좋은 직장을 다녀서도 아니다.
오래 냈느냐, 중간에 끊겼느냐.
이게 수령액을 가른다.
​
국민연금 수령액은
두 가지로 결정된다.
​
하나는 얼마를 냈느냐.
하나는 얼마나 오래 냈느냐.
​
사람들은 첫 번째만 생각한다.
월급이 많아야 연금도 많이 받는다고.
​
​
근데 실제 계산 구조를 보면
가입기간이 훨씬 크게 작용한다.
​
국민연금에는 균등부분이라는 게 있다.
전체 가입자의 평균소득을 기준으로
누구에게나 똑같이 깔아주는 부분이다.
​
소득이 낮아도
오래 부으면 이 부분이 계속 쌓인다.
​
그래서 월급 250만원으로 30년 부은 사람이
월급 500만원으로 15년 부은 사람보다
연금을 더 받는 일이 실제로 생긴다.
​
100만원 이상 받는 사람들의 공통점이 이거다.
20년, 30년을 끊기지 않고 냈다는 것.
​
여기서 문제가 되는 게 있다.
​
직장을 그만두거나
사업이 어려워지거나
경력이 단절되면
보험료를 안 내는 기간이 생긴다.
​
이 기간은 가입기간에서 통째로 빠진다.
​
100만원 이상 수급자 중
남성은 103만명인데
여성은 7만명뿐이다.
​
​
소득 차이도 있지만
경력단절로 가입기간이 끊긴 영향이 크다.
​
그럼 이미 끊긴 사람은 방법이 없을까.
있다.
​
첫 번째는 추납이다.
과거에 못 냈던 기간의 보험료를
나중에 채워 넣는 제도다.
그만큼 가입기간이 되살아난다.
​
두 번째는 임의가입이다.
소득이 없는 전업주부도
본인이 신청하면 국민연금에 가입할 수 있다.
가입기간을 스스로 늘리는 방법이다.
​
세 번째는 임의계속가입이다.
60세가 넘어도
가입기간이 아쉬운 사람은
65세까지 더 부을 수 있다.
​
10년만 채우면 받으니까 됐다.
이렇게 생각하는 사람이 많다.
​
근데 10년 채운 사람과
30년 채운 사람은
매달 받는 돈이 두 배 넘게 차이 난다.
​
그리고 이 차이는
한 달이 아니라
죽을 때까지 매달 반복된다.
​
20년 받는다고 치면
수천만원에서 억 단위로 벌어진다.
​
​
지금 확인할 건 하나다.
​
내 국민연금 가입기간이 몇 년인지.
중간에 빠진 기간이 있는지.
​
국민연금공단 앱이나 홈페이지에서
1분이면 확인된다.
​
빠진 기간이 있다면
추납이 가능한지 알아보는 것.
그게 노후 수령액을 바꾸는
가장 현실적인 방법이다.
​
연금을 많이 받는 사람들은
특별한 재테크를 한 게 아니었다.
​
그냥 끊기지 않게 관리했을 뿐이다.
그 단순한 차이가
노후에 매달 도착하는 돈을 바꾼다.
​
실제 수급자 분포를 봐도
100만원에서 130만원 사이가
46만명으로 제일 많고
​
130에서 160만원이 28만명
160에서 200만원 받는 사람도 24만명이나 된다.
​
최고 수령액은 월 317만원이다.
​
국민연금만으로 300만원 넘게 받는 사람이
실제로 존재한다는 뜻이다.
​
참고로 지금 보험료를 내는 중이라면
소득의 9%를 내고 있는 건데
직장인은 회사가 절반을 내준다.
​
내 돈 4.5%로
회사 돈까지 얹어서 쌓는 구조라
직장 다니는 동안이
가입기간 채우기 제일 유리한 시기다.
​
이걸 알고 다니는 것과
모르고 다니는 것은
같은 회사를 다녀도 노후가 달라진다.


