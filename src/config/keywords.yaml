version: "1.0"

# ============================================================
# 키워드 설정
# 목적:
# 1. RSS 기사 자동 분류
# 2. 중요 기사 선별
# 3. 정책/지원금 기사 탐지
# 4. AI 연구 주제 확장
# 5. 블로그 주제 선정
# ============================================================

settings:

  # 키워드 매칭 방식
  match:
    case_sensitive: false
    partial_match: true

  # 여러 카테고리에 동시에 해당할 수 있음
  multi_category: true

  # 핵심 키워드가 발견되면 중요도를 높임
  high_priority_keywords:
    - 기준금리
    - 금리인상
    - 금리인하
    - 물가
    - 환율
    - 원달러
    - 코스피
    - 코스닥
    - 주가
    - 배당
    - 실적
    - 부동산
    - 집값
    - 전세
    - 청약
    - 지원금
    - 보조금
    - 민생지원금
    - 소비쿠폰
    - 정책자금
    - 소상공인
    - 세금
    - 세제개편
