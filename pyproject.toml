[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-scroll"
version = "0.1.0"
description = "파이썬 3.14 기반 각종 사이트 뉴스 스크래핑 엔진"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Developer" }
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.2",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
topic-scroll = "main:app"

[tool.setuptools.packages.find]
where = ["src"]
